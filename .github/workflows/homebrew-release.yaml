# Homebrew tap release workflow for tokenless.
#
# Triggered by pushing a tag matching `tokenless/v*`.
# Creates a GitHub Release with a source tarball (rtk pre-patched, build
# artifacts excluded) and updates the Formula in shiloong/homebrew-tap.
#
# Required repository secret:
#   TAP_REPO_TOKEN — PAT with `repo` scope for pushing to shiloong/homebrew-tap.
name: Homebrew Release

on:
  push:
    tags:
      - 'tokenless/v*'

permissions:
  contents: write

jobs:
  homebrew-release:
    name: Homebrew Release ${{ github.ref_name }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Parse version from tag ----
      - name: Parse version
        id: parse
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VERSION="${TAG#tokenless/v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tarball=tokenless-${VERSION}.tar.gz" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG, Version: $VERSION"

      # ---- Create source tarball (rtk patched, no build artifacts) ----
      # Inlines the logic from Makefile dist-brew without requiring `make`,
      # so we avoid pulling in Rust/Node build dependencies.
      - name: Create source tarball
        working-directory: src/tokenless
        run: |
          RTK_TAG="v0.36.0"
          RTK_DIR="third_party/rtk"
          PATCH_DIR="third_party/patches"

          # Setup rtk if not already present
          if [ ! -f "$RTK_DIR/Cargo.toml" ]; then
            echo "Cloning rtk $RTK_TAG..."
            git clone --depth 1 --branch "$RTK_TAG" \
              https://github.com/rtk-ai/rtk.git "$RTK_DIR"
            echo "Applying tokenless stats patch..."
            patch --forward -p1 --no-backup-if-mismatch \
              -d "$RTK_DIR" < "$PATCH_DIR/rtk-tokenless-stats.patch"
          else
            echo "rtk already set up."
          fi

          # Create tarball (excludes build artifacts)
          TARBALL="${{ steps.parse.outputs.tarball }}"
          tar czf "../../$TARBALL" \
            --exclude='target' \
            --exclude='.git' \
            --exclude='__pycache__' \
            --exclude='node_modules' \
            -C .. tokenless

          SHA=$(sha256sum "../../$TARBALL" | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "Tarball: $TARBALL"
          echo "SHA256:  $SHA"
        id: tarball

      # ---- Create GitHub Release and upload tarball ----
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.parse.outputs.tag }}"
          VERSION="${{ steps.parse.outputs.version }}"
          TARBALL="${{ steps.parse.outputs.tarball }}"

          gh release create "$TAG" \
            --title "tokenless $VERSION" \
            --notes "## tokenless $VERSION

          LLM Token Optimization Toolkit

          ### Install via Homebrew

          \`\`\`bash
          brew tap shiloong/tap
          brew install tokenless
          \`\`\`

          ### What's included

          - **tokenless** — schema/response compression CLI
          - **rtk** — command rewriting engine (vendored, pre-patched)
          - **toon** — TOON format encoder/decoder
          - Adapter resources for Claude Code, Copilot Shell, OpenClaw, Hermes, Qoder, Codex" \
            "$TARBALL"

          echo "Release created: $TAG"

      # ---- Update Homebrew tap Formula via GitHub API ----
      # Uses the Contents API (no git clone needed, avoids PAT auth issues
      # with git credential helpers).
      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_REPO_TOKEN }}
        run: |
          VERSION="${{ steps.parse.outputs.version }}"
          SHA="${{ steps.tarball.outputs.sha256 }}"
          TAG="${{ steps.parse.outputs.tag }}"
          URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${{ steps.parse.outputs.tarball }}"
          TAP_REPO="shiloong/homebrew-tap"

          echo "URL: $URL"
          echo "SHA: $SHA"

          # Get current file content and SHA from GitHub API
          CURRENT=$(gh api "repos/${TAP_REPO}/contents/Formula/tokenless.rb" --jq '.content' | base64 -d)
          FILE_SHA=$(gh api "repos/${TAP_REPO}/contents/Formula/tokenless.rb" --jq '.sha')

          # Apply sed replacements
          UPDATED=$(echo "$CURRENT" | sed \
            -e 's|url ".*"|url "'"$URL"'"|' \
            -e 's|sha256 ".*"|sha256 "'"$SHA"'"|' \
            -e 's|version ".*"|version "'"$VERSION"'"|')

          # Show diff
          diff <(echo "$CURRENT") <(echo "$UPDATED") || true

          # Encode updated content to base64 (no line wrapping)
          CONTENT_B64=$(echo "$UPDATED" | base64 -w 0 2>/dev/null || echo "$UPDATED" | base64 | tr -d '\n')

          # Update file via GitHub API
          gh api "repos/${TAP_REPO}/contents/Formula/tokenless.rb" \
            --method PUT \
            -f message="tokenless: bump to v${VERSION}" \
            -f content="$CONTENT_B64" \
            -f sha="$FILE_SHA" \
            --jq '.commit.html_url'

          echo "Tap Formula updated."
